<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#E6F0FA"/>

  <!-- Clipboard -->
  <rect x="34" y="28" width="60" height="80" rx="6" fill="#FFFFFF" stroke="#3A7BD5" stroke-width="2"/>
  
  <!-- Clip -->
  <rect x="52" y="20" width="24" height="12" rx="3" fill="#3A7BD5"/>

  <!-- Checklist Lines -->
  <line x1="48" y1="50" x2="82" y2="50" stroke="#888" stroke-width="2"/>
  <line x1="48" y1="65" x2="82" y2="65" stroke="#888" stroke-width="2"/>
  <line x1="48" y1="80" x2="82" y2="80" stroke="#888" stroke-width="2"/>

  <!-- Checkmarks -->
  <polyline points="40,48 44,52 50,44" fill="none" stroke="#28A745" stroke-width="2"/>
  <polyline points="40,63 44,67 50,59" fill="none" stroke="#28A745" stroke-width="2"/>
  <polyline points="40,78 44,82 50,74" fill="none" stroke="#28A745" stroke-width="2"/>

  <!-- Box (Material) -->
  <rect x="20" y="70" width="20" height="20" fill="#D9A066" stroke="#8B5A2B" stroke-width="2"/>
  <line x1="20" y1="80" x2="40" y2="80" stroke="#8B5A2B" stroke-width="2"/>

  <!-- Gear (Process) -->
  <circle cx="80" cy="40" r="8" fill="#FF9800"/>
  <circle cx="80" cy="40" r="3" fill="#fff"/>

</svg>